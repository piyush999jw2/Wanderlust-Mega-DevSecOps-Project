apiVersion: apps/v1
kind: Deployment
metadata:
  name: wanderlust-backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: wanderlust
spec:
  replicas: {{ .Values.backend.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: backend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: wanderlust

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: wanderlust-backend-config

            - secretRef:
                name: wanderlust-backend-secret

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
